stages:
  - validate
  - build
  - attest
  - verify
  - provenance

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
  tags:
    - k8s
    - shared

# Required external project/group CI/CD variables. Configure every secret as
# protected and restrict image publication to protected refs (see rules below):
# - COSIGN_PRIVATE_KEY_FILE (File): encrypted, externally provisioned Cosign key.
# - COSIGN_PUBLIC_KEY_FILE (File): public half of the same Cosign key pair.
# - COSIGN_PASSWORD (masked/hidden variable): private-key decryption password.
# Optional: REGISTRY_INTERNAL_CA_FILE (File) adds a PEM CA bundle without ever
# disabling TLS verification. The canonical registry currently uses public PKI.
variables:
  PNPM_STORE_DIR: .pnpm-store
  REGISTRY_PUSH_HOST: registry.orchid-labs.xyz:32443
  REGISTRY_PULL_HOST: registry.orchid-labs.xyz:32443
  EXPECTED_CI_SERVER_URL: https://gitlab.orchid-labs.xyz
  EXPECTED_PROJECT_PATH: research-and-development/denicheur-breizh
  KUBERNETES_CPU_REQUEST: "100m"
  # Keep one running job plus its terminating predecessor below the shared
  # namespace's 2500m CPU quota: 2 * (1000m build + 100m helper) = 2200m.
  KUBERNETES_CPU_LIMIT: "1"
  KUBERNETES_MEMORY_REQUEST: "256Mi"
  # The observed shared-namespace teardown high-water mark was 3584Mi. A new
  # 1024Mi build plus its 128Mi helper still fits below the 5Gi quota.
  KUBERNETES_MEMORY_LIMIT: "1Gi"
  KUBERNETES_HELPER_CPU_REQUEST: "50m"
  KUBERNETES_HELPER_CPU_LIMIT: "100m"
  KUBERNETES_HELPER_MEMORY_REQUEST: "64Mi"
  KUBERNETES_HELPER_MEMORY_LIMIT: "128Mi"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.app-changes: &app-changes
  - .dockerignore
  - .gitlab-ci.yml
  - Dockerfile.api
  - Dockerfile.web
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - turbo.json
  - apps/**/*
  - packages/**/*
  - scripts/**/*
  - tests/**/*
  - playwright.config.ts

.validation-rules: &validation-rules
  - if: $CI_COMMIT_TAG
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes: *app-changes
  - if: $CI_COMMIT_BRANCH
    changes: *app-changes

.image-build-rules: &image-build-rules
  - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"
  - if: $CI_COMMIT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "merge_request_event"
    changes: *app-changes

check-workspace:
  stage: validate
  # Every real job uses this project-wide lock. CPU, memory and inner Turbo
  # serialization leave teardown headroom for a terminating predecessor pod.
  resource_group: denicheur-breizh-ci
  variables:
    # The runner grants one CPU, so do not let Turbo contend API, web and
    # extension tasks against each other inside the same pod.
    TURBO_CONCURRENCY: "1"
  image: node:26.10.0-bookworm-slim@sha256:662933cf47f013bc8e4beb31a6116448427a82057ba7c42c97e4c5ba766504c2
  rules: *validation-rules
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - test -z "${COSIGN_PRIVATE_KEY_FILE:-}" && test -z "${COSIGN_PASSWORD:-}"
    - npm install --global pnpm@12.7.0
    - pnpm config set store-dir "${CI_PROJECT_DIR}/${PNPM_STORE_DIR}"
    - pnpm install --frozen-lockfile
  script:
    - node scripts/ci/check-image-provenance-ci.mjs --self-test
    - node scripts/ci/test-provision-gitlab-cosign.mjs
    - pnpm check

.build-image:
  stage: build
  resource_group: denicheur-breizh-ci
  variables:
    # Kaniko and the in-image pnpm install need more than the 1Gi validation
    # profile. 1280Mi + the 128Mi helper still leaves 128Mi below the observed
    # 5Gi quota when a 3584Mi predecessor is terminating.
    KUBERNETES_MEMORY_LIMIT: "1280Mi"
  image:
    name: ghcr.io/osscontainertools/kaniko:v1.28.5-debug@sha256:d6d74217dc077acfd3094992e917c357080a2d3fdd1042a49e34e29a7e57c572
    entrypoint: [""]
  needs:
    - check-workspace
  rules: *image-build-rules
  script:
    - test -z "${COSIGN_PRIVATE_KEY_FILE:-}" && test -z "${COSIGN_PASSWORD:-}"
    - test "${CI_PROJECT_PATH}" = "${EXPECTED_PROJECT_PATH}"
    - |
      if [ -n "${REGISTRY_INTERNAL_CA_FILE:-}" ]; then
        if [ ! -f "${REGISTRY_INTERNAL_CA_FILE}" ] || [ ! -s "${REGISTRY_INTERNAL_CA_FILE}" ]; then
          echo "REGISTRY_INTERNAL_CA_FILE must point to a non-empty CA bundle when configured" >&2
          exit 1
        fi
        if ! grep -q -- '-----BEGIN CERTIFICATE-----' "${REGISTRY_INTERNAL_CA_FILE}" \
          || ! grep -q -- '-----END CERTIFICATE-----' "${REGISTRY_INTERNAL_CA_FILE}"; then
          echo "REGISTRY_INTERNAL_CA_FILE must contain at least one PEM certificate" >&2
          exit 1
        fi
        if [ ! -f /kaniko/ssl/certs/ca-certificates.crt ]; then
          echo "Kaniko system CA bundle was not found" >&2
          exit 1
        fi
        printf '\n' >> /kaniko/ssl/certs/ca-certificates.crt
        sed -n 'p' "${REGISTRY_INTERNAL_CA_FILE}" >> /kaniko/ssl/certs/ca-certificates.crt
      fi
    - mkdir -p /kaniko/.docker
    - |
      gitlab_auth="$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"},"%s":{"auth":"%s"}}}\n' \
        "${CI_REGISTRY}" "${gitlab_auth}" "${REGISTRY_PUSH_HOST}" "${gitlab_auth}" \
        > /kaniko/.docker/config.json
    - |
      image_repository="${REGISTRY_PUSH_HOST}/${CI_PROJECT_PATH}/${IMAGE_NAME}"
      cache_repository="${image_repository}/cache"

      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/${DOCKERFILE_PATH}" \
        --build-arg OCI_REVISION="${CI_COMMIT_SHA}" \
        --build-arg PNPM_LOCKFILE_PREVERIFIED=true \
        --cache=true \
        --cache-repo "${cache_repository}" \
        --cache-run-layers=true \
        --compressed-caching=false \
        --cache-ttl=168h \
        --cleanup \
        --snapshot-mode=redo \
        --reproducible \
        --destination="${image_repository}:sha-${CI_COMMIT_SHA}" \
        --destination="${image_repository}:ci-${CI_PIPELINE_ID}" \
        --digest-file="${CI_PROJECT_DIR}/${IMAGE_NAME}.digest" \
        ${EXTRA_BUILD_ARGS}
    - |
      digest="$(tr -d '\r\n' < "${CI_PROJECT_DIR}/${IMAGE_NAME}.digest")"
      case "${digest}" in
        sha256:*) ;;
        *) echo "Kaniko did not emit a sha256 digest for ${IMAGE_NAME}" >&2; exit 1 ;;
      esac
      test "${#digest}" -eq 71
      case "${digest#sha256:}" in
        *[!0-9a-f]*|'') echo "Kaniko emitted an invalid digest for ${IMAGE_NAME}" >&2; exit 1 ;;
      esac
      case "${CI_COMMIT_SHA}" in
        *[!0-9a-f]*|'') echo "CI_COMMIT_SHA is not a lowercase hexadecimal revision" >&2; exit 1 ;;
      esac
      case "${#CI_COMMIT_SHA}" in
        40|64) ;;
        *) echo "CI_COMMIT_SHA has an unexpected length" >&2; exit 1 ;;
      esac
      case "${CI_PIPELINE_ID}" in
        *[!0-9]*|'') echo "CI_PIPELINE_ID is not numeric" >&2; exit 1 ;;
      esac
      case "${CI_JOB_ID}" in
        *[!0-9]*|'') echo "CI_JOB_ID is not numeric" >&2; exit 1 ;;
      esac
      case "${IMAGE_NAME}" in
        api|web) ;;
        *) echo "Unexpected image name: ${IMAGE_NAME}" >&2; exit 1 ;;
      esac
      case "${REGISTRY_PULL_HOST}" in
        *[!a-zA-Z0-9._:-]*|'') echo "REGISTRY_PULL_HOST cannot be encoded safely in build metadata" >&2; exit 1 ;;
      esac

      immutable_image="${REGISTRY_PULL_HOST}/${CI_PROJECT_PATH}/${IMAGE_NAME}@${digest}"
      printf '%s\n' "${digest}" > "${CI_PROJECT_DIR}/${IMAGE_NAME}.digest"
      printf '%s\n' "${immutable_image}" > "${CI_PROJECT_DIR}/${IMAGE_NAME}.image"
      printf '%s\n' "${CI_JOB_ID}" > "${CI_PROJECT_DIR}/${IMAGE_NAME}.build-job-id"

      test "$(tr -d '\r\n' < "${CI_PROJECT_DIR}/${IMAGE_NAME}.digest")" = "${digest}"
      test "$(tr -d '\r\n' < "${CI_PROJECT_DIR}/${IMAGE_NAME}.image")" = "${immutable_image}"
      test "$(tr -d '\r\n' < "${CI_PROJECT_DIR}/${IMAGE_NAME}.build-job-id")" = "${CI_JOB_ID}"
  artifacts:
    name: "${CI_JOB_NAME}-${CI_COMMIT_SHA}"
    paths:
      - "${IMAGE_NAME}.digest"
      - "${IMAGE_NAME}.image"
      - "${IMAGE_NAME}.build-job-id"
    expire_in: 30 days

build-api-image:
  extends: .build-image
  variables:
    IMAGE_NAME: api
    DOCKERFILE_PATH: Dockerfile.api
    EXTRA_BUILD_ARGS: ""

build-web-image:
  extends: .build-image
  variables:
    IMAGE_NAME: web
    DOCKERFILE_PATH: Dockerfile.web
    EXTRA_BUILD_ARGS: >-
      --build-arg VITE_API_BASE_URL=/api
      --build-arg VITE_ENABLE_REALTIME=false

.cosign-job:
  resource_group: denicheur-breizh-ci
  image:
    name: cgr.dev/chainguard/cosign:latest-dev@sha256:a790a4f273f25d95e3a1df67a48b792f92a75ca230f31d2cea95371401fe40e1
    entrypoint: [""]
  rules: *image-build-rules

sign-image-provenance:
  extends: .cosign-job
  stage: attest
  environment:
    name: cosign-signing
    action: prepare
  needs:
    - job: build-api-image
      artifacts: true
    - job: build-web-image
      artifacts: true
  script:
    - sh scripts/ci/sign-image-provenance.sh
  artifacts:
    name: "signed-image-provenance-${CI_COMMIT_SHA}"
    paths:
      - api.digest
      - api.image
      - api.build-job-id
      - api.provenance.json
      - web.digest
      - web.image
      - web.build-job-id
      - web.provenance.json
    expire_in: 30 days

verify-image-cryptography:
  extends: .cosign-job
  stage: verify
  needs:
    - job: sign-image-provenance
      artifacts: true
  script:
    - sh scripts/ci/verify-image-cryptography.sh
  artifacts:
    name: "cryptographically-verified-images-${CI_COMMIT_SHA}"
    paths:
      - api.digest
      - api.image
      - api.build-job-id
      - api.provenance.json
      - api.signature-verification.json
      - api.attestation-verification.json
      - web.digest
      - web.image
      - web.build-job-id
      - web.provenance.json
      - web.signature-verification.json
      - web.attestation-verification.json
    expire_in: 30 days

verify-image-provenance:
  stage: provenance
  resource_group: denicheur-breizh-ci
  image: node:26.10.0-bookworm-slim@sha256:662933cf47f013bc8e4beb31a6116448427a82057ba7c42c97e4c5ba766504c2
  needs:
    - job: verify-image-cryptography
      artifacts: true
  rules: *image-build-rules
  script:
    - test -z "${COSIGN_PRIVATE_KEY_FILE:-}" && test -z "${COSIGN_PASSWORD:-}"
    - node scripts/ci/verify-image-provenance.mjs
  artifacts:
    name: "verified-image-provenance-${CI_COMMIT_SHA}"
    paths:
      - api.digest
      - api.image
      - api.build-job-id
      - api.provenance.json
      - api.signature-verification.json
      - api.attestation-verification.json
      - web.digest
      - web.image
      - web.build-job-id
      - web.provenance.json
      - web.signature-verification.json
      - web.attestation-verification.json
      - verified-images.env
    reports:
      dotenv: verified-images.env
    expire_in: 30 days
