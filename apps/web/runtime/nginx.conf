worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  log_format denicheur '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
  access_log /dev/stdout denicheur;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /tmp/denicheur/gateway-auth-runtime.conf;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    if ($denicheur_gateway_access_denied) {
      return 401;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location = /api {
      return 404;
    }

    # ^~ is security-significant: media paths ending in .webp must be proxied,
    # never handled by the static-asset regex below.
    location ^~ /api/ {
      include /tmp/denicheur/proxy-runtime.conf;

      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_buffering off;

      proxy_set_header Host $proxy_host;
      proxy_set_header Connection "";
      proxy_set_header Proxy-Authorization "";
      proxy_set_header Origin "";
      proxy_set_header Referer "";
      proxy_set_header Cookie "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Denicheur-Ingress-Token "";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_hide_header Authorization;
      proxy_hide_header Proxy-Authorization;
      proxy_hide_header Set-Cookie;
      proxy_hide_header Cache-Control;

      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|ico|png|jpg|jpeg|gif|svg|webp|avif|woff2?|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
      try_files $uri =404;
    }
  }
}
